services:
  # ==========================================
  # INFRAESTRUTURA - BANCO DE DADOS
  # ==========================================
  postgres-saga:
    container_name: mentoria-postgres-saga
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saga_db
      POSTGRES_USER: ${SAGA_DB_USER}
      POSTGRES_PASSWORD: ${SAGA_DB_PASSWORD}
    volumes:
      - saga_data:/var/lib/postgresql/data
    networks:
      - saga-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-account:
    container_name: mentoria-postgres-account
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: ${ACCOUNT_DB_USER}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD}
    volumes:
      - account_data:/var/lib/postgresql/data
    networks:
      - account-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-assessment:
    container_name: mentoria-postgres-assessment
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assessment_db
      POSTGRES_USER: ${ASSESSMENT_DB_USER}
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD}
    volumes:
      - assessment_data:/var/lib/postgresql/data
    networks:
      - assessment-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-feedback:
    container_name: mentoria-postgres-feedback
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: ${FEEDBACK_DB_USER}
      POSTGRES_PASSWORD: ${FEEDBACK_DB_PASSWORD}
    volumes:
      - feedback_data:/var/lib/postgresql/data
    networks:
      - feedback-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-study-plan:
    container_name: mentoria-postgres-study-plan
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_plan_db
      POSTGRES_USER: ${STUDY_PLAN_DB_USER}
      POSTGRES_PASSWORD: ${STUDY_PLAN_DB_PASSWORD}
    volumes:
      - study_plan_data:/var/lib/postgresql/data
    networks:
      - study-plan-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ai:
    container_name: mentoria-postgres-ai
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: ${AI_DB_USER}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ai_data:/var/lib/postgresql/data
    networks:
      - ai-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # INFRAESTRUTURA - RABBITMQ
  # ==========================================

  rabbitmq:
    container_name: mentoria-rabbitmq
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # SERVIÇOS DE DOMÍNIO
  # ==========================================
  saga-orchestrator:
    container_name: mentoria-saga-orchestrator
    build: ../../services/saga-orchestrator
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-saga:5432/saga_db
      SPRING_DATASOURCE_USERNAME: ${SAGA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SAGA_DB_PASSWORD}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    depends_on:
      postgres-saga:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - app
      - saga-db

  account:
    container_name: mentoria-account
    restart: on-failure
    build: ../../services/account
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/account_db
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-account:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - account-db

  assessment:
    container_name: mentoria-assessment
    restart: on-failure
    build: ../../services/assessment
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-assessment:5432/assessment_db
      SPRING_DATASOURCE_USERNAME: ${ASSESSMENT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ASSESSMENT_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ACCOUNT_SERVICE_URL: http://account:8080
      FEEDBACK_SERVICE_URL: http://feedback:8080
    depends_on:
      postgres-assessment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account:
        condition: service_started
    networks:
      - app
      - assessment-db

  feedback:
    container_name: mentoria-feedback
    restart: on-failure
    build: ../../services/feedback
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-feedback:5432/feedback_db
      SPRING_DATASOURCE_USERNAME: ${FEEDBACK_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${FEEDBACK_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres-feedback:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - app
      - feedback-db

  study-plan:
    container_name: mentoria-study-plan
    restart: on-failure
    build: ../../services/study-plan
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-study-plan:5432/study_plan_db
      SPRING_DATASOURCE_USERNAME: ${STUDY_PLAN_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${STUDY_PLAN_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-study-plan:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - study-plan-db

  # ==========================================
  # AI SERVICE
  # ==========================================

  ai-service:
    container_name: mentoria-ai-service
    restart: on-failure
    build: ../../ai-service
    environment:
      DATABASE_URL: postgresql://postgres-ai:5432/ai_db
      PGUSER: ${AI_DB_USER}
      PGPASSWORD: ${AI_DB_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres-ai:
        condition: service_healthy
    networks:
      - app
      - ai-db

  # ==========================================
  # BFFs
  # ==========================================

  bff-student:
    container_name: mentoria-bff-student
    restart: on-failure
    build: ../../bffs/student
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      ACCOUNT_SERVICE_URL: http://account:8080
      ASSESSMENT_SERVICE_URL: http://assessment:8080
      FEEDBACK_SERVICE_URL: http://feedback:8080
      STUDY_PLAN_SERVICE_URL: http://study-plan:8080
    depends_on:
      - account
      - assessment
      - feedback
      - study-plan
    networks:
      - app

  bff-teacher:
    container_name: mentoria-bff-teacher
    restart: on-failure
    build: ../../bffs/teacher
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      ACCOUNT_SERVICE_URL: http://account:8080
      ASSESSMENT_SERVICE_URL: http://assessment:8080
      FEEDBACK_SERVICE_URL: http://feedback:8080
      STUDY_PLAN_SERVICE_URL: http://study-plan:8080
    depends_on:
      - account
      - assessment
      - feedback
      - study-plan
    networks:
      - app

  # ==========================================
  # API GATEWAY
  # ==========================================

  gateway:
    container_name: mentoria-gateway
    restart: on-failure
    build: ../../gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
      ACCOUNT_SERVICE_URL: http://account:8080
      BFF_STUDENT_URL: http://bff-student:8080
      BFF_TEACHER_URL: http://bff-teacher:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174
    depends_on:
      - account
      - bff-student
      - bff-teacher
    networks:
      - edge
      - app

  # ==========================================
  # CLIENTES REACT
  # ==========================================

  client-student:
    container_name: mentoria-client-student
    restart: on-failure
    build: ../../clients/student
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - edge

  client-teacher:
    container_name: mentoria-client-teacher
    restart: on-failure
    build: ../../clients/teacher
    ports:
      - "3001:80"
    depends_on:
      - gateway
    networks:
      - edge

# ==========================================
# VOLUMES PERSISTENTES
# ==========================================

volumes:
  account_data:
  assessment_data:
  feedback_data:
  study_plan_data:
  ai_data:
  rabbitmq_data:
  saga_data:
# ==========================================
# REDES
# ==========================================

networks:
  edge:
    driver: bridge

  app:
    driver: bridge

  account-db:
    internal: true

  assessment-db:
    internal: true

  feedback-db:
    internal: true

  study-plan-db:
    internal: true
  saga-db:
    internal: true

  ai-db:
    internal: true
