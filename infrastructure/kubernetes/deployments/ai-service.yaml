apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: docker-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: mentoria-rabbitmq-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mentoria-rabbitmq-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
            - name: FEEDBACK_SERVICE_URL
              value: http://feedback:8080
            - name: DATABASE_URL
              value: postgresql://postgres-ai:5432/ai_db
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mentoria-db-secrets
                  key: AI_DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mentoria-db-secrets
                  key: AI_DB_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mentoria-ai-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mentoria-ai-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: mentoria-ai-secrets
                  key: LLM_PROVIDER
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20