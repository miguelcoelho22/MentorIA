spring.application.name=feedback
spring.mvc.problemdetails.enabled=true
spring.sql.init.mode=always

feedback.ai.base-url=${AI_SERVICE_URL:http://ai-service:8000}
feedback.ai.analysis-path=/api/v1/analysis
feedback.ai.timeout=2s
feedback.ai.attempts=3

feedback.rabbitmq.exchange=mentoria.events
feedback.rabbitmq.routing-key=feedback.published
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
feedback.outbox.interval-ms=1000
feedback.outbox.confirm-timeout=3s
