spring.application.name=assessment
spring.mvc.problemdetails.enabled=true
spring.sql.init.mode=always

assessment.account.base-url=${ACCOUNT_SERVICE_URL:http://account:8080}
assessment.account.timeout=2s

assessment.saga.exchange=mentoria.saga
assessment.saga.start-queue=saga.redacao.enviada
assessment.saga.start-routing-key=redacao.enviada
assessment.saga.result-queue=assessment.correcao.resultado
assessment.saga.result-routing-key=assessment.correcao.resultado
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
assessment.outbox.interval-ms=1000
assessment.outbox.confirm-timeout=3s
