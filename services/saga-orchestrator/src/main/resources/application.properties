spring.application.name=saga-orchestrator
spring.mvc.problemdetails.enabled=true

# Banco, usuário, senha e RabbitMQ vêm das variáveis SPRING_DATASOURCE_* e SPRING_RABBITMQ_* (Compose/K8s).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

saga.assessment.url=${ASSESSMENT_SERVICE_URL:http://assessment:8080}
saga.account.url=${ACCOUNT_SERVICE_URL:http://account:8080}
saga.feedback.url=${FEEDBACK_SERVICE_URL:http://feedback:8080}
saga.http.timeout=3s

# Prazo para o AI Service responder. Vencido, a SAGA compensa (cancela o rascunho e libera a cota).
saga.analysis-timeout=${SAGA_ANALYSIS_TIMEOUT:60s}
saga.feedback-timeout=${SAGA_FEEDBACK_TIMEOUT:30s}
# Intervalo para repetir passos que dependem de outro serviço (reserva, compensação e confirmação).
saga.retry-after=10s
saga.watchdog.interval-ms=5000

management.endpoints.web.exposure.include=health,info
