spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-auth
              uri: ${ACCOUNT_SERVICE_URL:http://account:8080}
              predicates:
                - Path=/api/v1/auth/**

            - id: bff-student-correction-requests
              uri: ${BFF_STUDENT_URL:http://bff-student:8080}
              order: -1
              predicates:
                - Path=/api/v1/student/essays/*/correction-requests
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@correctionRateLimiter}"
                    key-resolver: "#{@principalNameKeyResolver}"
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@generalRateLimiter}"
                    key-resolver: "#{@principalNameKeyResolver}"

            - id: bff-student
              uri: ${BFF_STUDENT_URL:http://bff-student:8080}
              predicates:
                - Path=/api/v1/student/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@generalRateLimiter}"
                    key-resolver: "#{@principalNameKeyResolver}"

            - id: bff-teacher
              uri: ${BFF_TEACHER_URL:http://bff-teacher:8080}
              predicates:
                - Path=/api/v1/teacher/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@generalRateLimiter}"
                    key-resolver: "#{@principalNameKeyResolver}"

          httpclient:
            connect-timeout: 2000
            response-timeout: 30s

server:
  port: 8080

mentoria:
  gateway:
    jwt:
      jwk-set-uri: ${ACCOUNT_SERVICE_URL:http://account:8080}/api/v1/auth/jwks
      issuer: account
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174}
    rate-limit:
      general-per-minute: 60
      correction-per-minute: 2

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
