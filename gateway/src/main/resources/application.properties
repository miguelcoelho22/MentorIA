spring.application.name=gateway
server.port=8080

# Rota para o BFF do estudante
spring.cloud.gateway.server.webflux.routes[0].id=bff-student
spring.cloud.gateway.server.webflux.routes[0].uri=${BFF_STUDENT_URL:http://bff-student:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/student/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

# Rota para o BFF do professor
spring.cloud.gateway.server.webflux.routes[1].id=bff-teacher
spring.cloud.gateway.server.webflux.routes[1].uri=${BFF_TEACHER_URL:http://bff-teacher:8080}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/teacher/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2